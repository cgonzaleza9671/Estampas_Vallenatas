    <script>
      // Prevent crash when third-party libraries try to write to window.fetch or globalThis.fetch in sandboxed environment/iframes
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _currentFetch = _rawFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch(e) {
          console.warn("Could not patch window.fetch with writable property:", e);
        }
      })();
    </script>
